pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false   // ← Kotlin 2.1.0
}

// 🔧 FIX: patch namespace untuk plugin lama (isar_flutter_libs)
// HARUS di settings.gradle, bukan build.gradle — karena afterEvaluate
// hanya bisa dipasang sebelum subproject di-evaluate.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.library') {
        project.android {
            if (namespace == null) {
                namespace = project.group.toString()
            }
        }
    }
    project.plugins.withId('com.android.application') {
        project.android {
            if (namespace == null) {
                namespace = project.group.toString()
            }
        }
    }
}

include ":app"